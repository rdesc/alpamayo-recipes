# Loads the released Alpamayo 2 Super checkpoint directly via from_pretrained --
# unlike Alpamayo-1/1.5, there is no "A1-format" conversion step: the release
# checkpoint is already a native HF PreTrainedModel (config.json + safetensors).
_target_: alpamayo2_super.models.alpamayo2_super.Alpamayo2Super.from_pretrained
pretrained_model_name_or_path: nvidia/Alpamayo2-Super
dtype: bfloat16
