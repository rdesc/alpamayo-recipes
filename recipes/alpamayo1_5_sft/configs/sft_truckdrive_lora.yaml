# NOTE: new file in this fork -- not in upstream NVlabs/alpamayo-recipes.
# Stage-1 TruckDrivePublic trajectory fine-tune with LoRA on the VLM backbone.
#
# Identical to sft_truckdrive.yaml (same traj-only processor, data, viz and
# val_metric setup) except LoRA is enabled and the learning rate is raised --
# adapters tolerate / prefer a higher LR than full fine-tuning. Mirrors the
# sft_stage1_nav -> sft_stage1_nav_lora relationship.
#
#   torchrun --nproc_per_node 8 -m alpamayo1_5_sft.train_hf \
#     --config-path pkg://alpamayo1_5_sft/configs \
#     --config-name sft_truckdrive_lora \
#     data.train_dataset.data_root=/path/to/truckdrive \
#     data.val_dataset.data_root=/path/to/truckdrive
#
# CHECKPOINT FORMAT: checkpoints here contain full Trainer shards, but adapted
# Linears are stored as `...base_layer.weight` plus separate unmerged
# `...lora_A/lora_B...` tensors, and each checkpoint also gets a small `adapter/`
# dir. Consumers that match weights BY NAME must account for that:
#
#   * evaluate_hf.py  -- handled automatically; it detects `adapter/` and injects
#     the adapters before loading, so the keys line up.
#   * Stage 2 (model.stage1_vlm_checkpoint_path) -- NOT handled. Merge first:
#       a1_5_sft/bin/python -m alpamayo1_5_sft.truckdrive.merge_lora \
#           --checkpoint <this_output_dir>/checkpoint-N --output <merged_dir>
#     then point stage1_vlm_checkpoint_path at <merged_dir>.
#
# load_alpamayo1_vlm now raises if any vlm.* param would be left unloaded, so a
# mismatch fails loudly instead of silently evaluating a half-random model.
defaults:
  - sft_truckdrive
  # true_lora (not default) => freeze_non_adapted: true. With lora/default.yaml this
  # Stage-1 model leaves embeddings/lm_head (1.28B) and the vision tower (576M) fully
  # trainable next to only 43.6M of LoRA -- not a LoRA run in any meaningful sense.
  - /lora@lora: true_lora
  - _self_

trainer:
  # LoRA trains far fewer params; a higher LR is typical.
  learning_rate: 1e-4
  # The VLM backbone is frozen under LoRA, so the per-group multiplier is unused.
  lr_multiplier: null

# Override LoRA hyper-params here if desired, e.g.:
# lora:
#   r: 32
#   alpha: 64

paths:
  output_dir: ???
task_name: alpamayo_1_5_sft_truckdrive_lora
