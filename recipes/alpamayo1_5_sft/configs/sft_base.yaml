# NOTE: modified in this fork -- see upstream NVlabs/alpamayo-recipes for the original.
defaults:
  # NOTE (fork): ENABLED (upstream ships this commented out). Every config
  # inheriting sft_base therefore has `wandb`, evals included -- and
  # `wandb.output_dir` resolves to ${paths.output_dir}, so an eval run that
  # inherits a training config's output_dir would find that run's .wandb_id.
  # evaluate_hf.py refuses to resume it; see the note there before changing.
  - /wandb: default
  - /vla_processor@data.train_dataset.vla_preprocess_args: default
  - /vla_processor@data.val_dataset.vla_preprocess_args: default
data:
  collate_fn:
    _target_: alpamayo.processor.qwen_processor.collate_fn_from_model_config
    _partial_: true
    chat_template_version: r1_5
  train_dataset:
    _recursive_: false
    _target_: alpamayo.data.pai.PAIDataset
    local_dir: ???
    chunk_ids: "0-99"
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _recursive_: false
    _target_: alpamayo.data.pai.PAIDataset
    local_dir: ???
    chunk_ids: "99-100"
    use_default_keyframe: true
    vla_preprocess_args:
      generation_mode: true
paths:
  output_dir: ./output_sft
callbacks: {}
evaluate:
  max_eval_steps: -1
  torch_dtype: bfloat16
  # Persist per-sample predictions + GT for offline metric recomputation.
  # When predictions_dir is null it defaults to <eval_ckpt>/eval (or ./eval if
  # no eval_ckpt is set). See evaluate_hf.py.
  save_predictions: true
  predictions_dir: null
  metric_runner:
    _target_: alpamayo.metrics.metric_runner.MetricRunner
    metrics:
      - _target_: alpamayo.metrics.metric_api.ReasoningSampler
        num_traj_sets: 1
        top_p: 0.98
        temperature: 0.6
        traj_only_generation: false # set true for pure-trajectory splits (no CoT), e.g. TruckDrive
        return_extra: false # set true to also dump decoded CoT/meta_action/answer (needs traj_only_generation=false)
        max_generation_length: 256
      - _target_: alpamayo.metrics.metric_api.DistanceMetrics
trainer:
  output_dir: ${paths.output_dir}
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 1e-4
  warmup_steps: 100
  logging_steps: 5
  save_steps: 500
  save_total_limit: 2
  # null by default; set to `true` (latest checkpoint-* in output_dir) or a
  # specific checkpoint-XXXX path to resume. Listed explicitly here (rather
  # than left unset) so `trainer.resume_from_checkpoint=...` works as a plain
  # CLI override -- Hydra's struct mode rejects adding brand-new keys that
  # way and would otherwise require a `+trainer.resume_from_checkpoint=...`.
  resume_from_checkpoint: null
  num_train_epochs: 3
  bf16: True
  dataloader_pin_memory: True
  # Raised from the upstream default (2): these boxes have 192 cores and sit at
  # ~15% load even with other users' jobs running, so 2 workers/rank (8 total
  # across a 4-GPU job) was leaving most of that idle -- each sample decodes
  # multiple full-res camera JPEGs (5-6 cameras x several frames), which is the
  # kind of per-sample CPU work more workers actually parallelizes. Re-check if
  # ever run on a smaller/quieter box.
  dataloader_num_workers: 16
  remove_unused_columns: False
  report_to: wandb # change to "wandb" when enabling W&B
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1e-6
  # enable zero2 for stage 1 vlm finetuning
  deepspeed: configs/deepspeed/zero2.json
  # enable gradient checkpointing for stage 1 vlm finetuning
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false # recommended by PyTorch for performance
task_name: alpamayo_r1_5_sft
run_name: ${task_name}_${now:%Y%m%d}_${now:%H%M%S}
# Trajectory-prediction visualization logged to W&B (off by default).
# Enable with `viz.enabled=true` (requires W&B and a val set built with
# generation_mode: true). Renders GT-vs-predicted trajectory + camera grid.
viz:
  enabled: false
  every_n_steps: 100
  num_samples: 2
  num_traj_samples: 2
  top_p: 0.98
  temperature: 0.6
  on_train_begin: true
