# NOTE: new file in this fork -- not in upstream NVlabs/alpamayo-recipes.
# LoRA settings, consumed by alpamayo1_5_sft.models.lora.LoraSettings.
# Enable by adding `- /lora@lora: default` to a training config's defaults list
# (see configs/sft_stage1_nav_lora.yaml for an example).
#
# By default LoRA is injected only into the VLM backbone (`target_submodule: vlm`).
# In the expert recipe the diffusion expert / projection heads stay fully trainable
# automatically, giving "LoRA on the frozen VLM + full-train expert head".
r: 16
alpha: 32
dropout: 0.05
# null -> Qwen-VL attention + MLP projections
# (q/k/v/o_proj, gate/up/down_proj). Override to a list or regex to narrow/widen.
target_modules: null
modules_to_save: null
bias: none
target_submodule: vlm
# false = every param LoRA did not wrap keeps the trainability the model constructor
# gave it. Correct for Stage 2 (VLM already frozen, expert head must train), but in
# Stage 1 nothing is pre-frozen, so this leaves embeddings/lm_head/vision tower
# FULLY trainable alongside the adapters. Use lora/true_lora.yaml for Stage-1 runs.
freeze_non_adapted: false
