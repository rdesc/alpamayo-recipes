# First RL smoke test for the CoC-action consistency reward (2026-08-16). Paired with
# models/reasoning_vla/alpamayo_cosmos_rl_post_training_coc_consistency_entry.py -- see
# that file's docstring for why this uses the plain motion-mini dataset instead of the
# reasoning-labeled one, and why reasoning_weight is 0 (Lingo-Judge unavailable right
# now, and this run is specifically about isolating coc_consistency).
#
# Adapted from alpamayo_rvla_rl_local_test_with_reasoning.toml:
#   - policy/rollout parallelism cut from 8 GPUs (6+2) to 4 GPUs (3+1) -- only GPUs 4-7
#     are free on this shared box, GPUs 0-3 belong to another user's running job.
#   - [policy].model_name_or_path repointed to the EFS checkpoint (the nvme one this
#     file used to point at was lost to an ephemeral-storage reset).
#   - [custom.alpamayo.reward]: traj_l2_weight/comfort_weight/reasoning_weight all 0.0,
#     coc_consistency_weight=1.0 -- the only active term, by design, for this first test.
#   - reasoning_grading_model_path removed: unused now that reasoning_weight=0 skips
#     loading the grader entirely (see the FIX note in aggregated_reward_with_reasoning.py).
#   - output_dir is a new, dedicated directory so this doesn't mix with prior runs'
#     checkpoints/logs under alpamayo_rl/.
#   - train_batch_per_replica/epoch trimmed down for a quick first look, not a full run.

redis = "12800"

[train]
resume = false
epoch = 8
output_dir = "/opt/dlami/nvme/rod/ckpts/alpamayo_rl_coc_consistency_test"
epsilon = 1e-6
optm_name = "AdamW"
optm_lr = 1.5e-6
optm_impl = "fused"
optm_weight_decay = 0.01
optm_betas = [0.9, 0.999]
optm_warmup_steps = 0
optm_grad_norm_clip = 1.0
async_tp_enabled = false
compile = false
param_dtype = "bfloat16"
fsdp_reduce_dtype = "float32"
fsdp_offload = false
fsdp_reshard_after_forward = "default"
# Counts rollouts, not prompts: prompts_per_step (per replica) = train_batch_per_replica / rollout.n_generation.
train_batch_per_replica = 24
sync_weight_interval = 2
validation_step = 50
validation_batch_per_replica = 4
non_text = true

[validation]
enable = false
freq = 50
batch_size = 4
temperature = 0.6
n_generation = 6


[rollout]
backend = "reasoning_vla_vllm_rollout"
gpu_memory_utilization = 0.8
enable_chunked_prefill = false
n_generation = 12
batch_size = 2
quantization = "none"
seed = 42

[rollout.sampling_config]
temperature = 0.6
top_p = 0.98
repetition_penalty = 1

[policy]
# ReasoningVLA HF checkpoint directory (must include ReasoningVLAConfig)
model_name_or_path = "/mnt/efs/users/rod/ckpts/Alpamayo-1.5-10B-rl-training"
model_max_length = 4096
model_gradient_checkpointing = true

[logging]
logger = ['console', 'wandb']
project_name = "alpamayo"
experiment_name = "CoC_Consistency_Smoke_Test"


[train.train_policy]
type = "grpo"
trainer_type = "reasoning_vla_grpo"
dataloader_shuffle = false
dataset.split = "train"
data_dispatch_as_rank_in_mesh = false
temperature = 1.0
epsilon_low = 0.2
epsilon_high = 0.28
lower_bound_ratio = 10.0
kl_beta = 0.0
unbiased_advantage = true
mu_iterations = 1
mini_batch = 1
min_filter_prefix_tokens = 1
allowed_outdated_steps = 50

[train.ckpt]
enable_checkpoint = true
save_freq = 50
save_mode = "async"
max_keep = 5

[rollout.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
dp_shard_size = 1
pp_size = 1
dp_replicate_size = 1

[policy.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
dp_shard_size = 3
pp_size = 1
dp_replicate_size = 1


[custom.alpamayo]
idx_rng_enable = false
idx_rng_seed = 1234
idx_rng_debug = false

[custom.alpamayo.traj_viz]
# Fork addition: BEV plot + the new coc-consistency card (camera/BEV/segmentation
# strip/claims/meta-action) in W&B -- see rewards/traj_viz.py.
enable = true
every_n_steps = 2
max_clips = 4

[custom.alpamayo.reward]
traj_l2_weight = 0.0
comfort_weight = 0.0
reasoning_weight = 0.0
coc_consistency_weight = 1.0

[custom.alpamayo.prefetch]
# Cache size; <= 0 disables node-prefetch. Set to train_batch_per_replica * replicas per node.
capacity = 24
num_workers = 5
log_level = "info"
log_request_details = false
